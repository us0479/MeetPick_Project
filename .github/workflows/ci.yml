name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 / Testcontainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 공유 초기본에는 Wrapper JAR가 아직 없을 수 있다.
      # setup-gradle이 9.7.1을 직접 준비하므로 첫 PR부터 CI가 동작한다.
      # Wrapper가 팀 PC에서 생성/커밋된 이후에도 동일 Gradle 버전을 유지한다.
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Backend test
        working-directory: backend
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean test --no-daemon
          else
            gradle clean test --no-daemon
          fi

  frontend:
    name: Frontend - React / TypeScript / Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          # package.json의 packageManager 필드 때문에 setup-node v7이 npm cache를 자동 활성화할 수 있다.
          # 초기 공유본에는 package-lock이 없으므로 명시적으로 cache를 끈다.
          package-manager-cache: false

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Frontend build
        working-directory: frontend
        run: npm run build
