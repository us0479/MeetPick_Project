name: Problem / Feature
description: 기능명이 아니라 해결할 문제 중심 Issue
title: "[Problem] "
labels: []
body:
  - type: dropdown
    id: owner
    attributes:
      label: 담당 영역
      description: TEAM_START_HERE 기준으로 선택하세요.
      options:
        - A - Auth / Security
        - B - Meeting / Data
        - C - Workflow / Recommendation
        - COMMON - 공통 계약 / Infra
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 / 목표
      description: "무엇을 적용할지보다 어떤 문제를 해결하는지 적습니다."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 재현 / 배경
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토할 대안
      description: 공부/실험 대상이면 최소 2개 후보를 적습니다.

  - type: checkboxes
    id: contract
    attributes:
      label: 공통 계약 변경 여부
      description: 아래 항목을 바꾸면 관련 Owner 리뷰와 문서/ADR 수정이 필요합니다.
      options:
        - label: Entity / Flyway / ERD 변경
        - label: API request/response/path 변경
        - label: MeetingStatus / 상태전이 변경
        - label: 인증 경계 / UTC 시간 정책 변경

  - type: textarea
    id: verification
    attributes:
      label: 완료 / 검증 기준
      description: 테스트, SQL 수치, 동시성 결과 등 확인 가능한 기준을 적습니다.
    validations:
      required: true
