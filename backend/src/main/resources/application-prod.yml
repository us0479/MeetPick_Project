# PROD profile skeleton: 실제 값은 환경변수/배포 secret에서 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s

# 운영 origin은 쉼표 구분 환경변수로 지정한다. '*' + credentials 조합은 사용하지 않는다.
meetpick:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API 문서는 local 개발에서만 공개한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

# Nginx/ALB 뒤에서도 scheme/host 정보를 올바르게 해석하기 위한 설정.
server:
  forward-headers-strategy: framework
